services:
  - type: web
    name: careeragent-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn careeragent.api.main:app --host 0.0.0.0 --port $PORT --app-dir src
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: careeragent-ai-phase6
      - key: LANGCHAIN_PROJECT
        value: careeragent-ai-phase6

  - type: web
    name: careeragent-dashboard
    runtime: python
    plan: free
    rootDir: .
    buildCommand: uv sync --frozen
    startCommand: uv run streamlit run app/ui/mission_control.py --server.port $PORT --server.address 0.0.0.0
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_BASE_URL
        value: https://careeragent-api.onrender.com