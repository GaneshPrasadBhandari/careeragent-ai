services:
  - type: web
    name: careeragent-api
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn careeragent.api.main:app --host 0.0.0.0 --port $PORT --app-dir src
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGSMITH_PROJECT
        value: careeragent-ai-new
      - key: LANGCHAIN_PROJECT
        value: careeragent-ai-new

  - type: web
    name: careeragent-dashboard
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: uv sync --frozen
    startCommand: uv run streamlit run app/ui/mission_control.py --server.port $PORT --server.address 0.0.0.0
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_BASE_URL
        fromService:
          type: web
          name: careeragent-api
          property: url