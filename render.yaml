services:
  - type: web
    name: careeragent-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: uv sync --frozen
    startCommand: uv run --no-sync uvicorn careeragent.api.main:app --host 0.0.0.0 --port $PORT --app-dir src
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - src/careeragent/api/**
        - src/careeragent/managers/**
        - src/careeragent/services/**
        - src/careeragent/langgraph/**
        - pyproject.toml
        - uv.lock
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_PROJECT
        value: careeragent-ai-phase6
      - key: LANGCHAIN_PROJECT
        value: careeragent-ai-phase6

  - type: web
    name: careeragent-dashboard
    runtime: python
    plan: free
    rootDir: .
    buildCommand: uv sync --frozen
    startCommand: uv run --no-sync python -m streamlit run app/ui/mission_control.py --server.port $PORT --server.address 0.0.0.0
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - app/ui/**
        - streamlit/**
        - pyproject.toml
        - uv.lock
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_BASE_URL
        value: https://careeragent-api.onrender.com
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: STREAMLIT_SERVER_PORT
        value: "10000"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
